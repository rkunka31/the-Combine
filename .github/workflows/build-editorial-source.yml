name: Build editorial source

on:
  push:
    branches: [main]
    paths:
      - 'data/sleeper-core.json'
      - 'scripts/build-editorial-source.py'
      - '.github/workflows/build-editorial-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build-editorial-source.py
      - name: Commit editorial source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial-source.json
          git diff --cached --quiet || git commit -m "Refresh editorial source"
          git push
